[package]
name = "automata_vizia"
version = "0.1.0"
edition = "2024"

[lints.clippy]
module_name_repetitions = "allow"
enum_glob_use = "deny"
unwrap_used = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.release]
debug = true

[build-dependencies]
regex = "1.12.2"

[dependencies]
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
vizia = {git = "https://github.com/vizia/vizia"}
